@media(min-width:700px){:root:not(.zoomed) main,:root:not(.zoomed) header .top{max-width:560px;margin:0 auto;width:100%}}

<header><div class="top"><h1><span class="logo">🚕</span><span id="title">K창 택시정산<small>영수증만 올리면 신청서는 알아서</small></span></h1>

<script src="config.js"></script>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},
             set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

async function api(action,body){
  const payload=Object.assign({action,token:store.get('kchang_token')},body||{});
  let lastErr;
  for(let i=0;i<3;i++){  // 구글 서버가 가끔 첫 호출에 늦거나 실패한다 → 2번 더 시도
    try{
      const r=await fetch(window.KCHANG_API,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},
                                            body:JSON.stringify(payload),redirect:'follow'});
      const j=await r.json();
      if(j.login){store.set('kchang_token',null);}
      return j;
    }catch(e){lastErr=e;await new Promise(r=>setTimeout(r,800*(i+1)))}
  }
  return {ok:false,msg:'서버에 연결하지 못했습니다. 잠시 뒤 다시 시도해 주세요'};
}

function setLinks(html){$('links').innerHTML=html}
function logout(){store.set('kchang_token',null);store.set('kchang_user',null);route()}

// ---------- 로그인/가입 ----------
function viewLogin(){
  document.documentElement.classList.remove('admin');setLinks('');
  $('main').className='center';
  $('main').innerHTML=`<div class="card">
    <div id="tab-login"><h2>👋 어서 오세요</h2>
      <div class="hint">택시 영수증만 올리면, 여비정산신청서는 알아서 만들어집니다.</div>
      <label>이름</label><input type="text" id="li-name" autocomplete="username">
      <label>비밀번호</label><input type="password" id="li-pw" autocomplete="current-password">
      <button id="btn-login">로그인</button>
      <button class="sub" id="btn-show-signup">처음이에요 — 가입하기</button>
      <div class="msg" id="li-msg"></div></div>
    <div id="tab-signup" style="display:none"><h2>✍️ 가입하기</h2>
      <div class="notice">가입은 <b>이름·사번·비밀번호</b>만 받습니다.<br>가입 후 <b>최초 1회 사인 등록</b>이 필요합니다. 사인은 여비정산신청서의 신청인 서명란에 쓰입니다.</div>
      <label>가입 코드 <b>(팀 공지 참고)</b></label><input type="text" id="su-code" autocomplete="off">
      <label>이름</label><input type="text" id="su-name">
      <label>사번</label><input type="text" id="su-empno" inputmode="numeric">
      <label>비밀번호</label><input type="password" id="su-pw">
      <button id="btn-signup">가입</button>
      <button class="sub" id="btn-show-login">돌아가기</button>
      <div class="msg" id="su-msg"></div></div></div>`;
  $('btn-show-signup').onclick=()=>{$('tab-login').style.display='none';$('tab-signup').style.display='block'};
  $('btn-show-login').onclick=()=>{$('tab-signup').style.display='none';$('tab-login').style.display='block'};
  $('btn-login').onclick=async e=>{e.target.disabled=true;$('li-msg').textContent='확인 중…';
    const r=await api('login',{name:$('li-name').value.trim(),pw:$('li-pw').value});
    e.target.disabled=false;
    if(r.ok){store.set('kchang_token',r.token);store.set('kchang_user',r.user);route()}else $('li-msg').textContent=r.msg};
  $('btn-signup').onclick=async e=>{e.target.disabled=true;$('su-msg').textContent='가입 중…';
    const r=await api('signup',{name:$('su-name').value.trim(),empno:$('su-empno').value.trim(),pw:$('su-pw').value,code:$('su-code').value.trim()});
    e.target.disabled=false;
    if(r.ok){store.set('kchang_token',r.token);store.set('kchang_user',r.user);route()}else $('su-msg').textContent=r.msg};
}

// ---------- 사인 ----------
function viewSign(){
  $('main').className='';
  $('main').innerHTML=`<div class="card"><h2>🖋 사인 등록</h2>
    <div class="notice"><b>최초 1회만 받습니다.</b><br>아래 칸에 손가락으로 평소 서명을 해주세요. 이후에는 다시 묻지 않고, 매달 신청서 서명란에 자동으로 들어갑니다.</div>
    <canvas id="pad"></canvas>
    <div class="row"><button class="sub" id="btn-clear">다시 쓰기</button><button id="btn-sign">이 사인으로 등록</button></div>
    <div class="msg" id="sg-msg"></div></div>`;
  const pad=$('pad'),ctx=pad.getContext('2d');
  pad.width=pad.clientWidth*2;pad.height=pad.clientHeight*2;ctx.scale(2,2);
  ctx.lineWidth=2.6;ctx.lineCap='round';ctx.strokeStyle='#111';
  let draw=false,px=0,py=0,drew=false;
  const pos=e=>{const r=pad.getBoundingClientRect(),z=(r.width/pad.clientWidth)||1;return[(e.clientX-r.left)/z,(e.clientY-r.top)/z]};
  pad.addEventListener('pointerdown',e=>{e.preventDefault();[px,py]=pos(e);draw=true});
  pad.addEventListener('pointermove',e=>{if(!draw)return;e.preventDefault();const[x,y]=pos(e);
    ctx.beginPath();ctx.moveTo(px,py);ctx.lineTo(x,y);ctx.stroke();[px,py]=[x,y];drew=true});
  addEventListener('pointerup',()=>draw=false);
  $('btn-clear').onclick=()=>{ctx.clearRect(0,0,pad.width,pad.height);drew=false};
  $('btn-sign').onclick=async e=>{if(!drew){$('sg-msg').textContent='사인을 먼저 해주세요';return}
    e.target.disabled=true;$('sg-msg').textContent='저장 중…';
    const r=await api('signature',{img:trimSign(pad)});
    e.target.disabled=false;
    if(r.ok)route();else $('sg-msg').textContent=r.msg};
}
// 흰/투명 배경 → 투명, 여백 잘라내기 (옛 서버가 하던 일을 폰에서)
function trimSign(pad){
  const c=pad.getContext('2d'),W=pad.width,H=pad.height,d=c.getImageData(0,0,W,H),p=d.data;
  let x0=W,y0=H,x1=-1,y1=-1;
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const i=(y*W+x)*4;
    if(p[i+3]===0||(p[i]>200&&p[i+1]>200&&p[i+2]>200)){p[i+3]=0;continue}
    if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
  if(x1<0)return pad.toDataURL('image/png');
  const o=document.createElement('canvas');o.width=x1-x0+1;o.height=y1-y0+1;
  c.putImageData(d,0,0);o.getContext('2d').drawImage(pad,x0,y0,o.width,o.height,0,0,o.width,o.height);
  return o.toDataURL('image/png');
}

// ---------- 내 화면 ----------
async function viewHome(me){
  $('main').className='';
  const rows=(me.receipts||[]).map((r,i)=>`<li><span class="no">${i+1}</span><span class="when">${esc(r.when)}</span><span class="fare">${esc(r.fare_s)}</span><span class="ok">접수됨</span></li>`).join('')
    ||'<li class="empty">아직 제출한 영수증이 없습니다</li>';
  $('main').innerHTML=`<div class="card"><h2 class="tight">🧾 영수증 제출</h2>
    <div class="filebox"><input type="file" id="rc-file" accept="image/*,.pdf" hidden>
      <button type="button" class="pick" id="btn-pick">📄 영수증 올리기</button>
      <div class="hint" id="rc-name">티맵·카카오T 앱 <b>영수증 내려받기</b>가 가장 정확</div><img id="preview"></div>
    <div class="fields">
      <label>구간 <b>(선택)</b></label><input type="text" id="rc-route" placeholder="광명 → 홍제역">
      <div class="row2"><div><label>탑승일</label><input type="text" id="rc-date" inputmode="decimal" placeholder="10. 10"></div>
        <div><label>요금</label><input type="text" id="rc-fare" inputmode="numeric" placeholder="12300"></div></div>
      <label>목적</label><input type="text" id="rc-purpose" placeholder="아이템 취재"></div>
    <button id="btn-submit">제출하기</button>
    <div class="hint" style="margin-top:9px">종이 영수증을 찍어 올렸다면 <b>실물은 이주언 행정에게 따로 제출</b></div>
    <div class="msg" id="rc-msg"></div></div>
  <div class="card"><h2>🗂 최근 제출 내역 (이번 달·지난달)</h2><ul class="list">${rows}</ul>
    ${me.fare_total?`<div class="total"><span>요금 입력분 합계</span><span>${esc(me.fare_total)}</span></div>`:''}
    <div class="notice" style="margin-top:12px">말일에 일괄로 신청서가 만들어져 이주언 행정에게 전달됩니다. 종이 영수증 실물은 따로 제출해 주세요.</div></div>`;
  const rf=$('rc-file');
  $('btn-pick').onclick=()=>rf.click();
  rf.onchange=()=>{const f=rf.files[0];if(!f)return;$('rc-name').textContent='✅ '+f.name;
    if(f.type.startsWith('image/')){$('preview').src=URL.createObjectURL(f);$('preview').style.display='block'}};
  $('btn-submit').onclick=async e=>{const f=rf.files[0];
    if(!f){$('rc-msg').textContent='영수증 파일을 선택해 주세요';return}
    const ext=(f.name.match(/\.[^.]+$/)||['.jpg'])[0].toLowerCase();
    if(!['.jpg','.jpeg','.png','.pdf','.heic'].includes(ext)){$('rc-msg').textContent='이미지 또는 PDF만 올릴 수 있습니다';return}
    e.target.disabled=true;$('rc-msg').className='msg';$('rc-msg').textContent='업로드 중…';
    try{
      const {data,mime,name}=await prepareFile(f,ext);
      const r=await api('receipt',{filename:name,mime,data,route:$('rc-route').value.trim(),
        date:normDate($('rc-date').value),fare:$('rc-fare').value.trim(),purpose:$('rc-purpose').value.trim()});
      if(r.ok){$('rc-msg').className='msg ok';$('rc-msg').textContent='✅ 제출됐습니다';route()}
      else{$('rc-msg').textContent=r.msg;e.target.disabled=false}
    }catch(err){$('rc-msg').textContent='파일을 읽지 못했습니다';e.target.disabled=false}};
}
// 탑승일: 숫자 키패드에 '/'가 없는 폰이 있어 '10. 10'·'10.10'·'10 10'·'1010'(MMDD)·'925'(MDD)을 모두 받는다.
// 구분자가 있으면 서버가 숫자만 뽑아 쓰므로 그대로 보내고, 숫자만 붙여 쓴 경우만 M/D로 나눈다.
function normDate(v){v=v.trim();const m=v.match(/^(\d{1,2})(\d{2})$/);return m?Number(m[1])+'/'+Number(m[2]):v}
// 큰 사진(4MB 초과)만 긴 변 2400px JPEG로 줄인다. PDF·작은 파일·HEIC는 원본 그대로.
function prepareFile(f,ext){
  const raw=()=>new Promise((ok,no)=>{const fr=new FileReader();
    fr.onload=()=>ok({data:fr.result.split(',')[1],mime:f.type||'application/octet-stream',name:f.name});fr.onerror=no;fr.readAsDataURL(f)});
  if(f.size<=4e6||!/^image\/(jpeg|png)$/.test(f.type))return raw();
  return new Promise(ok=>{const img=new Image();img.onload=()=>{
    const s=Math.min(1,2400/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    ok({data:c.toDataURL('image/jpeg',.9).split(',')[1],mime:'image/jpeg',name:f.name.replace(/\.[^.]+$/,'.jpg')})};
    img.onerror=()=>raw().then(ok);img.src=URL.createObjectURL(f)});
}

// ---------- 관리자 ----------
async function viewAdmin(){
  document.documentElement.classList.add('admin');
  $('title').innerHTML='📊 제출 현황 관리<small>K창 택시정산 · 관리자</small>';
  setLinks('<a id="lnk-back">← 내 화면</a>');$('lnk-back').onclick=()=>{location.hash='';};
  $('main').className='';$('main').innerHTML='<div class="loading">불러오는 중…</div>';
  const r=await api('admin');
  if(!r.ok){$('main').innerHTML=`<div class="card empty">${esc(r.msg)}</div>`;return}
  const people=r.people.map(p=>`<div class="card"><div class="who"><div class="avatar">${esc(p.name[0])}</div>
      <div><b>${esc(p.name)}</b><small>사번 ${esc(p.empno)} · 가입 ${esc(p.joined)}</small></div>
      <span class="badge ${p.has_sign?'y':'n'}">${p.has_sign?'사인 등록됨':'사인 미등록'}</span></div>
    <ul class="adm">${p.receipts.map(x=>`<li><a href="${esc(x.url)}" target="_blank" rel="noopener">🧾 ${esc(x.fn)}</a><span class="d">${esc(x.when)}</span><span class="f">${esc(x.fare)}</span></li>`).join('')
      ||'<li class="empty" style="justify-content:center">최근 2개월 제출 없음</li>'}</ul>
    ${p.total?`<div class="sum"><span>${p.receipts.length}건</span><span>${esc(p.total)}</span></div>`:''}</div>`).join('');
  $('main').innerHTML=`<div class="stats"><div class="stat"><span>가입 인원</span><b>${r.n_users}</b></div>
    <div class="stat"><span>최근 2개월 제출</span><b>${r.n_receipts}건</b></div>
    <div class="stat"><span>요금 입력 합계</span><b>${esc(r.grand_total)}</b></div></div>
    <div class="card"><div class="who"><div class="avatar">🔑</div><div><b>가입 코드</b><small>팀원에게만 공유하세요</small></div>
      <span class="badge y" style="font-size:14px">${esc(r.invite)}</span></div>
      ${r.not_joined?`<ul class="adm"><li><span class="d">아직 가입 안 한 팀원</span><span class="f" style="font-weight:600;font-size:13px;flex:1;text-align:right">${esc(r.not_joined)}</span></li></ul>`:''}
      <ul class="adm"><li><a href="${esc(r.root_url)}" target="_blank" rel="noopener">📁 구글 드라이브 저장 폴더 열기</a></li></ul></div>
    ${people||'<div class="card empty">아직 가입한 팀원이 없습니다.</div>'}`;
}

// ---------- 라우팅 ----------
async function route(){
  document.documentElement.classList.remove('admin');
  $('title').innerHTML='K창 택시정산<small>영수증만 올리면 신청서는 알아서</small>';
  if(!store.get('kchang_token')){viewLogin();return}
  if(location.hash==='#admin'){viewAdmin();return}
  $('main').className='';$('main').innerHTML='<div class="loading">불러오는 중…</div>';
  const me=await api('me');
  if(!me.ok){if(me.login||!store.get('kchang_token')){viewLogin();return}
    $('main').innerHTML=`<div class="card empty">${esc(me.msg)}<br><button id="btn-retry">다시 시도</button></div>`;$('btn-retry').onclick=route;return}
  setLinks((me.is_admin?'<a href="#admin">📊 관리자</a>':'')+`<a id="lnk-out">${esc(me.user)}님 · 로그아웃</a>`);
  $('lnk-out').onclick=logout;
  if(!me.has_sign)viewSign();else viewHome(me);
}
addEventListener('hashchange',route);
route();
</script></body></html>
